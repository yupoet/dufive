# dufive NNUE build of Rapfi.
#
# Derived from Networks/config-example/gomocalc-mix9svq.toml with
# coord_conversion_mode = "none" for the raw Piskvork coordinates the app
# speaks. The evaluator is the mix9svq NNUE: ~30 MB of weights, downloaded
# on demand only when the player picks the strongest engine, so the default
# offline payload stays around 1.3 MB.
#
# Weight files are searched in order and selected automatically per board
# size and rule: freestyle, standard 15×15, and the renju black/white pair.

[requirement]
min_version = [0, 43, 1]

[general]
reload_config_each_move = false
clear_hash_after_config_loaded = false
default_thread_num = 1
message_mode = "normal"
coord_conversion_mode = "none"
default_candidate_range = "square3_line4"
memory_reserved_mb = 0
default_tt_size_kb = 16384

[model]
binary_file = "model210901.bin"

[model.evaluator]
type = "mix9svq"
draw_black_winrate = 0.5
draw_ratio = 1.0

[[model.evaluator.weights]]
weight_file = "mix9svqfreestyle_bsmix.bin.lz4"

[[model.evaluator.weights]]
weight_file = "mix9svqstandard_bs15.bin.lz4"

[[model.evaluator.weights]]
weight_file_black = "mix9svqrenju_bs15_black.bin.lz4"
weight_file_white = "mix9svqrenju_bs15_white.bin.lz4"

[search]
aspiration_window = true
num_iteration_after_mate = 24
num_iteration_after_singular_root = 24
max_search_depth = 99

[search.timectl]
match_space = 21.0
match_space_min = 7.0
average_branch_factor = 1.7
advanced_stop_ratio = 0.75
move_horizon = 64

[database]
enable_by_default = false
type = "yixindb"
url = "rapfi.db"

[database.yixindb]
compressed_save = true
save_on_close = false
num_backups_on_save = 0
ignore_corrupted = true

[database.search]
readonly_mode = true
